  <path d="M 95 65 C 105 85, 130 115, 115 155 C 105 180, 80 185, 75 180 C 70 170, 75 145, 80 120 C 85 95, 90 75, 95 65 Z" fill="url(#chilliRed)"/>
  <!-- Chilli Highlight -->
  <path d="M 88 80 C 93 100, 105 125, 100 150" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Stem & Calyx -->
  <path d="M 95 65 C 93 45, 85 35, 75 30" stroke="url(#stemGreen)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 86 63 C 90 69, 100 70, 105 65 C 102 60, 92 58, 86 63 Z" fill="url(#stemGreen)"/>
  <text x="100" y="192" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#991b1b">Chilli / మిర్చి</text>
