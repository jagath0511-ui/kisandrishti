<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cottonBoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bractBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bgCotton)"/>
  <!-- Stem -->
  <path d="M 100 180 Q 95 130 100 95" stroke="#166534" stroke-width="5" fill="none"/>
  <!-- Calyx / Brown Bracts under boll -->
  <path d="M 70 105 L 100 115 L 130 105 L 115 125 L 100 120 L 85 125 Z" fill="url(#bractBrown)"/>
  <!-- White Cotton Puffs -->
  <circle cx="80" cy="80" r="24" fill="url(#cottonBoll)"/>
  <circle cx="120" cy="80" r="24" fill="url(#cottonBoll)"/>
  <circle cx="100" cy="62" r="25" fill="url(#cottonBoll)"/>
  <circle cx="100" cy="95" r="22" fill="url(#cottonBoll)"/>
  <!-- Fluff Texture shadows -->
  <path d="M 85 85 Q 100 90 115 85" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <path d="M 90 70 Q 100 65 110 70" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <text x="100" y="192" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">Cotton / ప్రత్తి</text>
</svg>

